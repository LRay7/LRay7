<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GigHound</title>
<style>
  :root {
    --bg: #14120f; --card: #1e1b16; --ink: #f0ead9; --dim: #9a917d;
    --accent: #e0a03c; --line: #322d24; --free: #7fb069;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 Georgia, 'Times New Roman', serif;
  }
  header { padding: 28px 20px 10px; max-width: 720px; margin: 0 auto; }
  h1 { margin: 0; font-size: 2rem; }
  h1 .dog { color: var(--accent); }
  .tagline { color: var(--dim); margin: 4px 0 0; font-style: italic; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 20px 60px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px;
  }
  .controls label { color: var(--dim); font-size: .9rem; }
  .controls output { color: var(--accent); font-weight: bold; }
  input[type=range] { accent-color: var(--accent); width: 160px; vertical-align: middle; }
  .daybtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .daybtns button {
    background: none; border: 1px solid var(--line); color: var(--ink);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .85rem;
  }
  .daybtns button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .daybtns button.on { border-color: var(--accent); color: var(--accent); }
  .mode { color: var(--dim); font-size: .78rem; font-style: italic; margin: 0 0 12px; }
  .event {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 16px; align-items: baseline;
  }
  .when { min-width: 86px; color: var(--accent); font-size: .9rem; }
  .what { flex: 1; }
  .who { font-size: 1.05rem; }
  .who a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .where { color: var(--dim); font-size: .88rem; }
  .meta { color: var(--dim); font-size: .8rem; text-align: right; white-space: nowrap; }
  .meta .free { color: var(--free); }
  .empty { color: var(--dim); font-style: italic; padding: 30px 0; text-align: center; }
  .dropzone {
    margin-top: 34px; border: 1px dashed var(--line); border-radius: 10px;
    padding: 18px; text-align: center; color: var(--dim); font-size: .9rem;
    cursor: pointer;
  }
  .dropzone.hover { border-color: var(--accent); color: var(--accent); }
  .dropzone input { display: none; }
  .droplog { color: var(--dim); font-size: .82rem; white-space: pre-wrap; margin-top: 8px; text-align: left; }
</style>
</head>
<body>
<header>
  <h1>Gig<span class="dog">Hound</span> &#128021;</h1>
  <p class="tagline">every live show near you — even the ones the big apps miss</p>
</header>
<main>
  <div class="controls">
    <label>within <output id="radiusOut">25</output> mi
      <input type="range" id="radius" min="5" max="60" step="5" value="25" aria-label="search radius in miles">
    </label>
    <span class="daybtns" role="group" aria-label="date range">
      <button data-days="1">Tonight</button>
      <button data-days="3">Next 3 days</button>
      <button data-days="7" class="on">This week</button>
      <button data-days="30">This month</button>
    </span>
  </div>
  <p class="mode" id="mode"></p>
  <div id="list"><p class="empty">loading&hellip;</p></div>

  <label class="dropzone" id="dropzone">
    &#128444;&#65039; drop a gig-flyer screenshot here (or tap to choose) —
    Claude reads it and files the show
    <input type="file" id="flyerFile" accept="image/*">
    <div class="droplog" id="droplog"></div>
  </label>
</main>
<script>
  let pos = { lat: 40.685, lon: -80.107 };  // Cranberry Township fallback
  let days = 7;
  let staticEvents = null;  // populated when running without the API server

  const toRad = d => d * Math.PI / 180;
  const milesBetween = (a, b) => {
    const R = 3958.8, dp = toRad(b.lat - a.lat), dl = toRad(b.lon - a.lon);
    const h = Math.sin(dp/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dl/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  const fmtDate = iso => new Date(iso + 'T12:00:00')
    .toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  const fmtTime = t => {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h >= 12 ? 'pm' : 'am'}`;
  };
  const isoPlus = n => {
    const d = new Date(); d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  };

  async function getEvents(radius) {
    // Prefer the live API; fall back to the exported events.json so the same
    // page works served statically (e.g. from a scheduled-crawl commit).
    if (staticEvents === null) {
      try {
        const r = await fetch(`/api/events?lat=${pos.lat}&lon=${pos.lon}&radius=${radius}&days=${days}`);
        if (!r.ok) throw new Error(r.status);
        document.getElementById('mode').textContent = '';
        return (await r.json()).events;
      } catch {
        try {
          const r = await fetch('static/events.json');
          if (!r.ok) throw new Error(r.status);
          const data = await r.json();
          staticEvents = data.events || [];
          document.getElementById('mode').textContent =
            `static snapshot from ${data.generated} — run \`gighound serve\` for live data`;
        } catch {
          return null;
        }
      }
    }
    const end = isoPlus(days), today = isoPlus(0);
    return staticEvents
      .filter(e => e.lat != null && e.date >= today && e.date < end)
      .map(e => ({ ...e, distance_miles:
        Math.round(milesBetween(pos, { lat: e.lat, lon: e.lon }) * 10) / 10 }))
      .filter(e => e.distance_miles <= radius)
      .sort((a, b) => a.date.localeCompare(b.date) || (a.start_time || '').localeCompare(b.start_time || ''));
  }

  async function refresh() {
    const radius = Number(document.getElementById('radius').value);
    const list = document.getElementById('list');
    const events = await getEvents(radius);
    if (events === null) {
      list.innerHTML = '<p class="empty">no data — run <code>gighound crawl</code> then <code>gighound serve</code> (or <code>gighound export</code>)</p>';
      return;
    }
    if (!events.length) {
      list.innerHTML = '<p class="empty">no shows in this range — widen the radius or the date window</p>';
      return;
    }
    list.innerHTML = events.map(e => `
      <div class="event">
        <div class="when">${fmtDate(e.date)}<br>${fmtTime(e.start_time)}</div>
        <div class="what">
          <div class="who">${e.url ? `<a href="${e.url}" target="_blank" rel="noopener">` : ''}${e.artist || e.title}${e.url ? '</a>' : ''}</div>
          <div class="where">${e.venue_name || ''}${e.genre ? ' &middot; ' + e.genre : ''}</div>
        </div>
        <div class="meta">${e.distance_miles} mi${e.price ? '<br>' + (e.price === 'Free' ? '<span class="free">Free</span>' : e.price) : ''}</div>
      </div>`).join('');
  }

  document.getElementById('radius').addEventListener('input', ev => {
    document.getElementById('radiusOut').textContent = ev.target.value;
    refresh();
  });
  document.querySelectorAll('.daybtns button').forEach(btn =>
    btn.addEventListener('click', () => {
      days = Number(btn.dataset.days);
      document.querySelectorAll('.daybtns button').forEach(b => b.classList.toggle('on', b === btn));
      refresh();
    }));

  // --- flyer drop zone -------------------------------------------------------
  const zone = document.getElementById('dropzone');
  const log = document.getElementById('droplog');
  async function sendFlyer(file) {
    log.textContent = `reading ${file.name}… (Claude vision, ~30s)`;
    const body = new FormData();
    body.append('file', file);
    const venue = prompt('Venue name (leave blank if it’s on the flyer):') || '';
    if (venue) body.append('venue', venue);
    try {
      const r = await fetch('/api/flyer', { method: 'POST', body });
      const data = await r.json();
      log.textContent = data.ok ? data.lines.join('\n') : `failed: ${data.error}`;
      if (data.ok) { staticEvents = null; refresh(); }
    } catch (e) {
      log.textContent = `upload failed: ${e} — flyer upload needs the live server (gighound serve)`;
    }
  }
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('hover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('hover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('hover');
    const f = e.dataTransfer.files[0];
    if (f) sendFlyer(f);
  });
  document.getElementById('flyerFile').addEventListener('change', e => {
    if (e.target.files[0]) sendFlyer(e.target.files[0]);
  });

  navigator.geolocation?.getCurrentPosition(
    p => { pos = { lat: p.coords.latitude, lon: p.coords.longitude }; refresh(); },
    () => refresh(),
    { timeout: 4000 }
  );
  refresh();
</script>
</body>
</html>
