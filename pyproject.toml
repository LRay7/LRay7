[project]
name = "gighound"
version = "0.1.0"
description = "Thorough live-music finder: crawls local venue sites, event calendars, and city papers, extracts events with an LLM, and serves a radius-filtered listing."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed for the opt-in pay-per-token API backend (GIGHOUND_EXTRACTOR=api).
# The default claude-cli backend uses your Claude subscription instead.
api = ["anthropic>=0.100"]

[project.scripts]
gighound = "gighound.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gighound"]
